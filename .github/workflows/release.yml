name: Release one application
run-name: Release ${{ inputs.release_tag || github.ref_name }}
on:
  push:
    tags: ['bitwarden-v*', 'obsidian-v*', 'motrix-v*', 'deepseek-harness-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing package tag to rebuild and publish; run this workflow from main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: package-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.resolve.outputs.package }}
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -z $REQUESTED_TAG ]]; then test "$GITHUB_REF_TYPE" = tag; fi
          tag=${REQUESTED_TAG:-$GITHUB_REF_NAME}
          commit=$(git rev-parse HEAD)
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$commit"
          git merge-base --is-ancestor HEAD origin/main
          echo "package=$(python3 scripts/package.py resolve "$tag")" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  package:
    needs: resolve
    uses: ./.github/workflows/build-package.yml
    with:
      package: ${{ needs.resolve.outputs.package }}
      release_tag: ${{ needs.resolve.outputs.tag }}
  publish:
    needs: [package, resolve]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arch-${{ needs.resolve.outputs.package }}
          path: dist/${{ needs.resolve.outputs.package }}
      - name: Publish exact verified package inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.resolve.outputs.package }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          python3 scripts/publish.py "$PACKAGE" "$SOURCE_COMMIT"
  sync:
    needs: [publish, resolve]
    permissions:
      contents: write
    uses: ./.github/workflows/sync-aur.yml
    with:
      project: ${{ needs.resolve.outputs.package }}
