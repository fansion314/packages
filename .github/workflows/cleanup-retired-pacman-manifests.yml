name: Clean two retired CNB pacman manifests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cleanup-retired-pacman-manifests
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'fansion314/packages' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          CNB_MIRROR_TOKEN: ${{ secrets.CNB_MIRROR_TOKEN }}
        run: |
          PYTHONPATH=arch python3 - <<'PY'
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import urlopen
          from mirror import Client, references, location
          from state import mirror_state, public_status

          repository = 'fansionia/packages'
          filename = 'manifest.json'
          approved = {
              'snapshot-7201e6c6803c37b403b59f035978a92c': (18133, 'f453428865b42f87fceeaa2d8962695233d9efd58f27908fb746c0be59db2f3a'),
              'snapshot-aad38aa734b05ee500b00610bdb3a146': (16401, 'bddc4bf60481a14543de4cb6ec3ac7a56354d5a0a907b7c80097ff6f2672916c'),
          }
          state = mirror_state()
          public = public_status()['mirror']
          if state['repository'] != repository or public['repository'] != repository:
              raise ValueError('Unexpected mirror repository')
          protected = references(state)
          client = Client(repository)
          removals = []
          for tag, (size, digest) in approved.items():
              url = location(repository, tag, filename)
              if url in protected or url in state['objects'] or tag.removeprefix('snapshot-') in public['snapshots']:
                  raise ValueError('Snapshot manifest is still managed or referenced: '+tag)
              release = client.release(tag)
              if release is None:
                  print('Release already absent:', tag)
                  continue
              assets = release.get('assets') or []
              expected = (filename, size, 'sha256', digest)
              listed = [(a['name'], a['size'], a.get('hash_algo'), a.get('hash_value')) for a in assets]
              if listed not in ([], [expected]):
                  raise ValueError('Unexpected assets on '+tag)
              try:
                  with urlopen(url, timeout=15):
                      raise ValueError('Retired manifest is still downloadable: '+tag)
              except HTTPError as error:
                  if error.code != 404:
                      raise
              removals.append((tag, str(release['id'])))
          for tag, release_id in removals:
              client.request('DELETE', f'/{repository}/-/releases/{quote(release_id, safe="")}')
              if client.release(tag) is not None:
                  raise ValueError('Retired release is still listed: '+tag)
              print('Removed retired CNB release:', tag)
          PY
