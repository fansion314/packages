name: Sync and test Homebrew
on:
  workflow_call:
    inputs:
      project:
        type: string
        default: ''
      full:
        type: boolean
        default: false
    secrets:
      CNB_MIRROR_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      project:
        description: Optional project ID (empty checks all)
        type: string
        default: ''
      full:
        description: Run full archive and installation verification
        type: boolean
        default: false
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths: ['homebrew/scripts/**', 'homebrew/templates/**', 'scripts/cnb_release.py', 'scripts/commit-generated.sh', 'scripts/sync.sh', '.github/workflows/sync-homebrew.yml']
permissions:
  contents: read
concurrency:
  group: homebrew-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PROJECT: ${{ inputs.project }}
      FULL_VERIFY: ${{ inputs.full && '1' || '0' }}
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s homebrew/scripts -p 'test_*.py' -v
      - run: bash scripts/sync.sh homebrew "$PROJECT"
      - name: Pin the validated maintenance commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  mirror:
    needs: sync
    outputs:
      needed: ${{ steps.prepare.outputs.needed }}
      identity: ${{ steps.prepare.outputs.identity }}
      projects: ${{ steps.prepare.outputs.projects }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.source_sha }}
          persist-credentials: false
      - name: Upload immutable CNB attachments and prepare the complete tap
        id: prepare
        env:
          CNB_MIRROR_TOKEN: ${{ secrets.CNB_MIRROR_TOKEN }}
        run: python3 homebrew/scripts/mirror.py prepare --output-root .work/homebrew-cnb ${{ inputs.full && '--full' || '' }}
      - name: Install and test the CNB candidate
        if: steps.prepare.outputs.needed == 'true'
        env:
          HOMEBREW_TAP_URL: https://cnb.cool/fansionia/packages
          HOMEBREW_CANDIDATE_ROOT: .work/homebrew-cnb
          VERIFY_PROJECTS: ${{ steps.prepare.outputs.projects }}
        run: python3 -c 'import json, os, subprocess; subprocess.run(["python3", "homebrew/scripts/sync.py", "--install", *json.loads(os.environ["VERIFY_PROJECTS"])], check=True)'
      - name: Publish the tested tap with a fast-forward push
        if: steps.prepare.outputs.needed == 'true'
        env:
          CNB_MIRROR_TOKEN: ${{ secrets.CNB_MIRROR_TOKEN }}
        run: python3 homebrew/scripts/mirror.py publish --output-root .work/homebrew-cnb
  mirror-public:
    needs: [sync, mirror]
    if: needs.mirror.outputs.needed == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_TAP_URL: https://cnb.cool/fansionia/packages
      HOMEBREW_VERIFY_PUBLISHED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.source_sha }}
          persist-credentials: false
      - name: Isolate the public download cache
        run: echo "HOMEBREW_CACHE=$RUNNER_TEMP/homebrew-cnb-public-cache" >> "$GITHUB_ENV"
      - name: Verify switching between both public origins
        run: bash homebrew/scripts/test-switch.sh
      - name: Require the public tap to match the validated content
        env:
          EXPECTED_IDENTITY: ${{ needs.mirror.outputs.identity }}
        run: |
          tap=$(brew --repository fansionia/tap)
          python3 - "$tap/homebrew/mirror.json" <<'PYVERIFY'
          import json, os, sys
          with open(sys.argv[1]) as stream:
              provenance = json.load(stream)
          if provenance.get('identity') != os.environ['EXPECTED_IDENTITY']:
              raise SystemExit('Public CNB tap does not match the validated content')
          PYVERIFY
      - name: Install and test changed packages from the public CNB tap
        env:
          VERIFY_PROJECTS: ${{ needs.mirror.outputs.projects }}
        run: python3 -c 'import json, os, subprocess; subprocess.run(["python3", "homebrew/scripts/sync.py", "--install", *json.loads(os.environ["VERIFY_PROJECTS"])], check=True)'
      - name: Record public acceptance after both checks succeed
        env:
          CNB_MIRROR_TOKEN: ${{ secrets.CNB_MIRROR_TOKEN }}
          EXPECTED_IDENTITY: ${{ needs.mirror.outputs.identity }}
        run: |
          tap=$(brew --repository fansionia/tap)
          python3 homebrew/scripts/mirror.py accept --output-root "$tap" --identity "$EXPECTED_IDENTITY"
