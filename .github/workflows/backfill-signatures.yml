name: Sign existing pacman release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public tag; only missing .sig assets are appended
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: append-release-signatures
  cancel-in-progress: false
jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and sign the exact public bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH_SIGNING_PRIVATE_KEY: ${{ secrets.ARCH_SIGNING_PRIVATE_KEY }}
          ARCH_SIGNING_PASSPHRASE: ${{ secrets.ARCH_SIGNING_PASSPHRASE }}
          ARCH_SIGNING_KEY_ID: ${{ secrets.ARCH_SIGNING_KEY_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 arch/sign.py backfill "$RELEASE_TAG"
