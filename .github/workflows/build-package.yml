name: Build one Arch package
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      release_tag:
        default: ""
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:base
    timeout-minutes: 120
    steps:
      - name: Initialize native Arch builder
        run: |
          pacman -Syu --noconfirm --needed base-devel git python
          useradd --create-home builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Install package dependencies
        env:
          PACKAGE: ${{ inputs.package }}
        run: bash scripts/arch-dependencies.sh "$PACKAGE"
      - name: Build and verify as an unprivileged user
        env:
          PACKAGE: ${{ inputs.package }}
          CI: 'true'
          RELEASE_TAG: ${{ inputs.release_tag }}
          RUSTC_WRAPPER: /usr/bin/sccache
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash scripts/build.sh "$PACKAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-${{ inputs.package }}
          path: |
            dist/${{ inputs.package }}/*.pkg.tar.zst
            dist/${{ inputs.package }}/*-aur.tar.gz
            dist/${{ inputs.package }}/build-info.json
            dist/${{ inputs.package }}/SHA256SUMS
            dist/${{ inputs.package }}/notes.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
