name: Sync and validate Arch recipes
on:
  workflow_call:
    inputs:
      project:
        type: string
        default: ""
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths: ['aur/sources.json', 'aur/scripts/**', 'aur/tests/**', 'scripts/commit-generated.sh', 'scripts/sync.sh', '.github/workflows/sync-aur.yml']
permissions:
  contents: read
concurrency:
  group: aur-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s aur/tests -v
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: aur/.cache/downloads
          key: arch-inputs-${{ hashFiles('aur/state/*.json') }}
          restore-keys: arch-inputs-
      - name: Synchronize and validate public recipes
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
        run: bash scripts/sync.sh aur "$PROJECT"
