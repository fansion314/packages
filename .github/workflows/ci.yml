name: Validate package maintenance
on:
  push:
    branches: [main]
    paths: ['packages/**', 'scripts/**', 'tests/**', 'arch/**', '.github/workflows/**', 'homebrew/scripts/**', 'homebrew/templates/**', 'aur/scripts/**', 'aur/tests/**', 'aur/sources.json']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      has_packages: ${{ steps.scope.outputs.has_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select affected application builds
        id: scope
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: python3 scripts/ci-packages.py "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s homebrew/scripts -p 'test_*.py' -v
      - run: python3 -m unittest discover -s aur/tests -v
      - run: python3 -m unittest discover -s arch/tests -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node --test arch/tests/*.test.mjs
      - name: Check shell syntax
        run: find scripts homebrew/scripts aur/scripts packages -type f -name '*.sh' -exec bash -n {} \;
  packages:
    needs: static
    if: needs.static.outputs.has_packages == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.static.outputs.matrix) }}
    uses: ./.github/workflows/build-package.yml
    with:
      package: ${{ matrix.package }}
  repository-integration:
    needs: static
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm --needed git python gnupg libarchive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise real signed databases and retry recovery with ephemeral keys
        env:
          CI_ARCH_REPOSITORY: '1'
        run: python -m unittest discover -s arch/tests -v
